spring:
  application:
    name: ${MPFM_APP_NAME:mpfm-backend}
  profiles:
    active: ${MPFM_SPRING_PROFILE:dev}
  servlet:
    multipart:
      max-file-size: ${MPFM_MAX_FILE_SIZE:1GB}
      max-request-size: ${MPFM_MAX_REQUEST_SIZE:1GB}

server:
  port: ${MPFM_SERVER_PORT:8080}
  ssl:
    enabled: ${MPFM_TLS_ENABLED:false}
    key-store: ${MPFM_TLS_KEYSTORE_PATH:}
    key-store-type: ${MPFM_TLS_KEYSTORE_TYPE:PKCS12}
    key-store-password: ${MPFM_TLS_KEYSTORE_PASSWORD:}
    key-alias: ${MPFM_TLS_KEY_ALIAS:}
    enabled-protocols: ${MPFM_TLS_ENABLED_PROTOCOLS:TLSv1.3,TLSv1.2}

management:
  endpoints:
    web:
      exposure:
        include: ${MPFM_MANAGEMENT_EXPOSE:health,info,prometheus}
